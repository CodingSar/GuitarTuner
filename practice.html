<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Guitar practice</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap"
    />
    <link rel="stylesheet" href="/src/app/theme.css" />
  </head>
  <body>
    <main>
      <nav aria-label="Pages">
        <a class="nav-button" href="index.html">Tuner</a>
        <a class="nav-button" href="practice.html" aria-current="page">Practice</a>
      </nav>
      <h1>Guitar practice</h1>
      <div id="songs" class="song-cards"></div>
      <div id="tempo">
        <label for="bpm">Tempo (BPM)</label>
        <div>
          <button id="tempo-minus" type="button" aria-label="Slower by 5 BPM">
            −
          </button>
          <input
            id="bpm"
            type="number"
            inputmode="numeric"
            min="20"
            max="240"
            step="1"
            value="100"
          />
          <button id="tempo-plus" type="button" aria-label="Faster by 5 BPM">
            +
          </button>
        </div>
        <p id="bpm-error" role="alert"></p>
        <p>Whole number, 20 to 240. Notes are spaced 60000 ÷ BPM ms apart.</p>
        <button id="tempo-reset" type="button">Reset to song default</button>
      </div>
      <div class="tally">
        <div class="readout">
          <span class="readout-label">Hits</span
          ><span id="hits" class="readout-value">0</span>
        </div>
        <div class="readout">
          <span class="readout-label">Missed</span
          ><span id="missed" class="readout-value">0</span>
        </div>
        <div class="readout">
          <span class="readout-label">Streak</span
          ><span id="streak" class="readout-value">0</span>
        </div>
      </div>
      <button id="start" type="button">Start</button>
      <button id="pause" type="button">Pause</button>
      <button id="resume" type="button">Resume</button>
      <button id="slower" type="button">Slower</button>
      <button id="faster" type="button">Faster</button>
      <button id="mic" type="button">Mic on</button>
      <canvas id="stage" width="360" height="480"></canvas>
    </main>
    <script type="module" src="/src/app/practice-page.ts"></script>
  </body>
</html>
