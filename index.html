<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Guitar tuner</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap"
    />
    <link rel="stylesheet" href="/src/app/theme.css" />
  </head>
  <body>
    <main>
      <nav aria-label="Pages">
        <a class="nav-button" href="index.html" aria-current="page">Tuner</a>
        <a class="nav-button" href="practice.html">Practice</a>
      </nav>
      <h1>Guitar tuner</h1>
      <div id="panel" data-state="none">
        <p id="note">–</p>
        <div id="meter" aria-hidden="true">
          <span id="needle" hidden></span>
        </div>
        <p id="readout" hidden></p>
      </div>
      <div id="side">
        <p id="status" role="status">Idle</p>
        <button id="start" type="button">Start listening</button>
        <button id="stop" type="button" hidden>Stop</button>
        <label>
          Tuning
          <select id="preset">
            <option value="standard" selected>Standard</option>
            <option value="drop-d">Drop D</option>
          </select>
        </label>
        <label>
          Reference A4 (Hz)
          <input id="reference" type="number" value="440" step="0.1" min="1" />
        </label>
        <ul id="strings"></ul>
      </div>
    </main>
    <script type="module" src="/src/app/index.ts"></script>
  </body>
</html>
